<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Please Give Me Bitcoin</title>
    <style>
            * {
                box-sizing: border-box;
            }

            .centered {
                text-align: center;
            }

            body {
                font-family: "Optima", "Segoe UI", sans-serif;
                background:
                    radial-gradient(circle at top left, rgba(255,255,255,0.22), transparent 28%),
                    radial-gradient(circle at bottom right, rgba(0,0,0,0.18), transparent 30%),
                    linear-gradient(135deg, #0f172a 0%, #1d4e89 28%, #0f766e 58%, #0b3b2e 100%);
                color: rgb(255, 255, 255);
                min-height: 100vh;
                margin: 0;
                padding: 0 20px 30px;
                position: relative;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            body::before {
                content: "";
                position: fixed;
                inset: 0;
                background: linear-gradient(120deg, rgba(255,255,255,0.06), transparent 35%, rgba(255,255,255,0.04));
                pointer-events: none;
            }

            /* (Removed animated rainbow border overlay) */

            .site-tag {
                position: absolute;
                top: 16px;
                left: 18px;
                font-size: 1rem;
                letter-spacing: 0.08em;
                opacity: 0.96;
                font-weight: 800;
                text-transform: lowercase;
                color: rgba(255,255,255,0.92);
                 z-index: 4; /* Restoring z-index */
            }

            h1 {
                margin: 0 auto;
                font-size: 2rem;
                font-weight: 700;
                letter-spacing: 0.04em;
                text-transform: none;
            }

            .wallet-grid {
                display: flex;
                justify-content: center;
                align-items: center;
                gap: 24px;
                flex-wrap: wrap;
                margin: 0 auto;
                width: min(980px, 100%);
                padding: 24px 10px;
                border-radius: 28px;
                background: rgba(255,255,255,0.02);
                border: 1px solid rgba(255,255,255,0.08);
                box-shadow: inset 0 1px 0 rgba(255,255,255,0.04);
            }

            .wallet-card {
                position: relative;
                display: flex;
                flex-direction: column;
                align-items: center;
                background: rgba(255, 255, 255, 0.08);
                border: 1px solid rgba(255, 255, 255, 0.16);
                border-radius: 24px;
                padding: 18px 16px 16px;
                width: min(280px, 100%);
                min-height: 320px;
                box-shadow: 0 12px 30px rgba(0, 0, 0, 0.12), inset 0 1px 0 rgba(255,255,255,0.1);
                backdrop-filter: blur(12px);
                -webkit-backdrop-filter: blur(12px);
                overflow: hidden;
                transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
            }

            .wallet-card:hover {
                transform: translateY(-5px);
                box-shadow: 0 18px 40px rgba(0, 0, 0, 0.16), inset 0 1px 0 rgba(255,255,255,0.14);
            }

            .wallet-label {
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 8px;
                width: 100%;
                margin: 0 0 14px;
                padding: 10px 8px 8px;
                text-align: center;
                background: transparent;
                border: none;
                border-radius: 0;
                box-shadow: none;
                color: #ffffff;
                font-family: "Segoe UI", "Arial Black", "Impact", sans-serif;
                font-size: 1.75rem;
                letter-spacing: 0.12em;
                text-transform: uppercase;
                font-weight: 900;
                line-height: 1;
                text-shadow: 0 2px 10px rgba(0,0,0,0.25), 0 0 18px rgba(255,255,255,0.12);
            }

            .wallet-label span {
                display: inline-block;
                transform: scaleY(1.08);
            }

            .wallet-logo {
                width: 42px;
                height: 42px;
                display: block;
                object-fit: contain;
                flex-shrink: 0;
                filter: drop-shadow(0 4px 10px rgba(0,0,0,0.28));
                background: transparent;
            }

            .qr-code {
                display: block;
                width: 150px;
                height: 150px;
                margin: 0 auto 12px;
                border-radius: 16px;
                background: rgba(255,255,255,0.94);
                padding: 10px;
                transition: box-shadow 0.25s ease, transform 0.15s ease, filter 0.25s ease;
                box-shadow: 0 12px 28px rgba(0,0,0,0.22);
                border: 1px solid rgba(255,255,255,0.7);
                position: relative;
                z-index: 1;
            }

            .made-by {
                position: fixed;
                left: 16px;
                bottom: 14px;
                font-size: 0.72rem;
                letter-spacing: 0.08em;
                text-transform: uppercase;
                opacity: 0.8;
                font-weight: 700;
                color: rgba(255,255,255,0.9);
                z-index: 2;
            }

            /* Slight colored glows for QR images to match card theme */
            .eth-glow .qr-code {
                box-shadow: 0 14px 34px rgba(0,0,0,0.24), 0 0 26px rgba(98,126,234,0.7), 0 0 52px rgba(98,126,234,0.8), 0 0 90px rgba(98,126,234,0.32);
            }

            .btc-glow .qr-code {
                box-shadow: 0 14px 34px rgba(0,0,0,0.24), 0 0 26px rgba(245,166,35,0.7), 0 0 52px rgba(245,166,35,0.8), 0 0 90px rgba(245,166,35,0.32);
            }

            .sol-glow .qr-code {
                box-shadow: 0 14px 34px rgba(0,0,0,0.24), 0 0 26px rgba(20,241,149,0.7), 0 0 52px rgba(20,241,149,0.8), 0 0 90px rgba(20,241,149,0.32);
            }

            /* Hover lift and pulsing glow animations */
            .wallet-card:hover .qr-code {
                transform: translateY(-6px) scale(1.03);
                filter: saturate(1.08);
            }

            .wallet-card:hover .scan-text {
                transform: translateY(-4px);
                opacity: 1;
            }

            .eth-glow:hover .qr-code {
                animation: ethPulse 1.6s ease-in-out infinite;
            }

            @keyframes ethPulse {
                0% {
                    box-shadow: 0 14px 34px rgba(0,0,0,0.24), 0 0 26px rgba(98,126,234,0.7), 0 0 52px rgba(98,126,234,0.8), 0 0 90px rgba(98,126,234,0.32);
                }
                50% {
                    box-shadow: 0 16px 42px rgba(0,0,0,0.28), 0 0 32px rgba(98,126,234,0.9), 0 0 68px rgba(98,126,234,1), 0 0 120px rgba(98,126,234,0.42);
                }
                100% {
                    box-shadow: 0 14px 34px rgba(0,0,0,0.24), 0 0 26px rgba(98,126,234,0.7), 0 0 52px rgba(98,126,234,0.8), 0 0 90px rgba(98,126,234,0.32);
                }
            }

            .btc-glow:hover .qr-code {
                animation: btcPulse 1.6s ease-in-out infinite;
            }

            @keyframes btcPulse {
                0% {
                    box-shadow: 0 14px 34px rgba(0,0,0,0.24), 0 0 26px rgba(245,166,35,0.7), 0 0 52px rgba(245,166,35,0.8), 0 0 90px rgba(245,166,35,0.32);
                }
                50% {
                    box-shadow: 0 16px 42px rgba(0,0,0,0.28), 0 0 32px rgba(245,166,35,0.9), 0 0 68px rgba(245,166,35,1), 0 0 120px rgba(245,166,35,0.42);
                }
                100% {
                    box-shadow: 0 14px 34px rgba(0,0,0,0.24), 0 0 26px rgba(245,166,35,0.7), 0 0 52px rgba(245,166,35,0.8), 0 0 90px rgba(245,166,35,0.32);
                }
            }

            .sol-glow:hover .qr-code {
                animation: solPulse 1.6s ease-in-out infinite;
            }

            @keyframes solPulse {
                0% {
                    box-shadow: 0 14px 34px rgba(0,0,0,0.24), 0 0 26px rgba(20,241,149,0.7), 0 0 52px rgba(20,241,149,0.8), 0 0 90px rgba(20,241,149,0.32);
                }
                50% {
                    box-shadow: 0 16px 42px rgba(0,0,0,0.28), 0 0 32px rgba(20,241,149,0.9), 0 0 68px rgba(20,241,149,1), 0 0 120px rgba(20,241,149,0.42);
                }
                100% {
                    box-shadow: 0 14px 34px rgba(0,0,0,0.24), 0 0 26px rgba(20,241,149,0.7), 0 0 52px rgba(20,241,149,0.8), 0 0 90px rgba(20,241,149,0.32);
                }
            }

            .wallet-address {
                 display: block;
                 margin: 12px auto 0;
                 padding: 6px 10px;
                 max-width: 94%;
                 background: transparent; /* removed bulky tint */
                 border: 1px solid rgba(255,255,255,0.06);
                 border-radius: 10px;
                 font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, "Segoe UI Mono", "Roboto Mono", monospace;
                 font-size: 0.78rem;
                 line-height: 1.35;
                 word-break: break-word;
                 text-align: center;
                 color: rgba(255,255,255,0.95);
                 box-shadow: inset 0 1px 0 rgba(255,255,255,0.02);
                 overflow-wrap: break-word;
                position: relative;
                z-index: 2; /* keep above qr glow */
            }

            .scan-text {
                opacity: 0.9;
                margin-bottom: 8px;
                transition: transform 0.18s ease, opacity 0.18s ease;
                transform: translateY(0);
                display: inline-block;
                font-size: 0.72rem;
                letter-spacing: 0.12em;
                text-transform: uppercase;
                position: relative;
                z-index: 3; /* sit above QR glow */
                background: transparent; /* remove bulky tint */
                padding: 0 6px; /* keep small horizontal breathing room */
                border-radius: 6px;
                color: rgba(255,255,255,0.98);
                text-shadow: 0 1px 2px rgba(0,0,0,0.6);
            }

            .eth-glow {
                border-color: rgba(98, 126, 234, 0.26);
                box-shadow: 0 0 0 1px rgba(98, 126, 234, 0.18), 0 12px 28px rgba(21, 35, 67, 0.18), 0 0 24px rgba(98, 126, 234, 0.28), 0 0 52px rgba(98, 126, 234, 0.18);
            }

            .eth-glow .wallet-label {
                color: rgba(98, 126, 234, 1);
            }

            .btc-glow {
                border-color: rgba(245, 166, 35, 0.26);
                box-shadow: 0 0 0 1px rgba(245, 166, 35, 0.18), 0 12px 28px rgba(44, 29, 5, 0.18), 0 0 24px rgba(245, 166, 35, 0.28), 0 0 52px rgba(245, 166, 35, 0.18);
            }

            .btc-glow .wallet-label {
                color: rgba(245, 166, 35, 1);
            }

            .sol-glow {
                border-color: rgba(20, 241, 149, 0.26);
                box-shadow: 0 0 0 1px rgba(20, 241, 149, 0.18), 0 12px 28px rgba(12, 39, 26, 0.18), 0 0 24px rgba(20, 241, 149, 0.28), 0 0 52px rgba(20, 241, 149, 0.18);
            }

            .sol-glow .wallet-label {
                color: rgba(20, 241, 149, 1);
            }
            
            /* Responsive adjustments */
            @media (max-width: 600px) {
                body {
                    padding: 64px 12px 24px; /* give room for .site-tag */
                    align-items: flex-start;
                    justify-content: flex-start;
                }

                .site-tag {
                    left: 50%;
                    transform: translateX(-50%);
                    top: 12px;
                    font-size: 0.9rem;
                }

                .made-by {
                    left: auto;
                    right: 12px;
                    bottom: 10px;
                    font-size: 0.64rem;
                }

                .wallet-grid {
                    width: 100%;
                    padding: 18px 10px;
                    gap: 16px;
                    border-radius: 18px;
                    flex-direction: column;
                    align-items: stretch;
                    z-index: 1;
                }

                .wallet-card {
                    width: 100%;
                    min-height: auto;
                    padding: 14px;
                    margin-bottom: 6px;
                }

                .wallet-label {
                    font-size: 1.15rem;
                    gap: 6px;
                }

                .wallet-logo {
                    width: 34px;
                    height: 34px;
                }

                .qr-code {
                    width: clamp(96px, 36vw, 140px);
                    height: auto;
                    aspect-ratio: 1/1;
                    margin-bottom: 8px;
                    padding: 8px;
                    border-radius: 12px;
                    box-shadow: 0 8px 18px rgba(0,0,0,0.18);
                }

                .wallet-address { font-size: 0.72rem; }
                .scan-text { font-size: 0.68rem; }
            }

            @media (min-width: 601px) and (max-width: 980px) {
                .wallet-grid {
                    width: min(860px, 100%);
                    gap: 18px;
                    padding: 20px;
                }

                .wallet-card {
                    width: calc(50% - 12px);
                    min-height: 300px;
                }

                .qr-code {
                    width: clamp(110px, 24vw, 150px);
                }

                .wallet-label { font-size: 1.4rem; }

                .site-tag { left: 18px; top: 14px; transform: none; font-size: 0.95rem; }
                .made-by { left: 16px; right: auto; bottom: 12px; font-size: 0.7rem; }
            }

            /* Desktop: three columns when space allows */
            @media (min-width: 981px) {
                .wallet-grid { gap: 28px; }
                .wallet-card { width: calc(33.333% - 18.666px); }
            }

            /* Move inline figure styles into CSS */
            .wallet-card figure { margin: 0; width: 100%; }
        </style>
</head>
<body>
    <div class="site-tag">pleasegivemebitcoin.com</div>
    <div class="made-by">Made by Homi</div>

    <section class="wallet-grid">
        <article class="wallet-card eth-glow">
            <div class="wallet-label">
                <img class="wallet-logo" src="logoeth.png" alt="Ethereum logo">
                <span>$ETH</span>
            </div>
            <figure class="centered">
                <img class="qr-code" src="ADDRESSETH.png" alt="ETH Address QR Code">
                <figcaption class="wallet-address">0xE965eF6728Da7cdb7042556AD7178eAc9dEB9217</figcaption>
            </figure>
        </article>

        <article class="wallet-card btc-glow">
            <div class="wallet-label">
                <img class="wallet-logo" src="logobtc.png" alt="Bitcoin logo">
                <span>$BTC</span>
            </div>
            <figure class="centered">
                <img class="qr-code" src="ADDRESSBTC.png" alt="BTC Address QR Code">
                <figcaption class="wallet-address">bc1qk5n4hdzzd3a0f64y740wnhxj8tdapgv8sd9djv</figcaption>
            </figure>
        </article>

        <article class="wallet-card sol-glow">
            <div class="wallet-label">
                <img class="wallet-logo" src="logosol.png" alt="Solana logo">
                <span>$SOL</span>
            </div>
            <figure class="centered">
                <img class="qr-code" src="ADDRESSSOL.png" alt="SOL Address QR Code">
                <figcaption class="wallet-address">H6BUkTV6htsuav3cw5kMcTYJ2MwYXCQ7B3Ezwq4XYytC</figcaption>
            </figure>
        </article>
    </section>
</body>
</html>
