<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Please Give Me Bitcoin</title>
        <style>
            * {
                box-sizing: border-box;
            }

            .centered {
                text-align: center;
            }

            body {
                font-family: "Optima", "Segoe UI", sans-serif;
                background: #2A7B9B;
                background: linear-gradient(90deg, rgba(42, 123, 155, 1) 0%, rgba(83, 237, 91, 1) 100%);
                color: rgb(255, 255, 255);
                min-height: 100vh;
                margin: 0;
                padding: 30px 20px;
                position: relative;
            }

            .site-tag {
                position: absolute;
                top: 12px;
                left: 16px;
                font-size: 1rem;
                letter-spacing: 0.04em;
                opacity: 0.9;
                font-weight: 600;
            }

            .wallet-grid {
                display: flex;
                justify-content: center;
                gap: 24px;
                flex-wrap: wrap;
                margin-top: 30px;
            }

            .wallet-card {
                background: rgba(255, 255, 255, 0.08);
                border: 1px solid rgba(255, 255, 255, 0.25);
                border-radius: 14px;
                padding: 18px 14px;
                width: min(260px, 100%);
                box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
            }

            .wallet-label {
                font-size: 0.9rem;
                letter-spacing: 0.08em;
                text-transform: uppercase;
                opacity: 0.85;
                margin-bottom: 12px;
            }

            .wallet-card img {
                display: block;
                width: 150px;
                height: 150px;
                margin: 0 auto 12px;
                border-radius: 10px;
                background: white;
                padding: 8px;
            }

            .wallet-address {
                font-size: 0.8rem;
                word-break: break-all;
                opacity: 0.95;
            }

            .scan-text {
                opacity: 0.7;
                margin-bottom: 8px;
            }
        </style>
</head>
<body>
    <div class="site-tag">pleasegivemebitcoin.com</div>
    <h1 class="centered">Please give me Crypto!</h1>

    <section class="wallet-grid">
        <article class="wallet-card">
            <div class="wallet-label centered">$ETH</div>
            <figure class="centered" style="margin: 0;">
                <figcaption class="scan-text">Scan Using Your Wallet</figcaption>
                <img src="ADDRESSETH.png" alt="ETH Address QR Code">
                <figcaption class="wallet-address">0xE965eF6728Da7cdb7042556AD7178eAc9dEB9217</figcaption>
            </figure>
        </article>

        <article class="wallet-card">
            <div class="wallet-label centered">$BTC</div>
            <figure class="centered" style="margin: 0;">
                <figcaption class="scan-text">Scan Using Your Wallet</figcaption>
                <img src="ADDRESSBTC.png" alt="BTC Address QR Code">
                <figcaption class="wallet-address">bc1qk5n4hdzzd3a0f64y740wnhxj8tdapgv8sd9djv</figcaption>
            </figure>
        </article>

        <article class="wallet-card">
            <div class="wallet-label centered">$SOL</div>
            <figure class="centered" style="margin: 0;">
                <figcaption class="scan-text">Scan Using Your Wallet</figcaption>
                <img src="ADDRESSSOL.png" alt="SOL Address QR Code">
                <figcaption class="wallet-address">H6BUkTV6htsuav3cw5kMcTYJ2MwYXCQ7B3Ezwq4XYytC</figcaption>
            </figure>
        </article>
    </section>
</body>
</html>
