<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Please Give Me Bitcoin</title>
    <style>
            html {
                max-width: 100%;
                overflow-x: clip;
            }

            * {
                box-sizing: border-box;
            }

            .centered {
                text-align: center;
            }

            body {
                font-family: "Optima", "Segoe UI", sans-serif;
                background:
                    radial-gradient(ellipse 90% 60% at 18% -8%, rgba(130,170,255,0.16), transparent 55%),
                    radial-gradient(ellipse 80% 60% at 100% 108%, rgba(20,241,149,0.10), transparent 55%),
                    radial-gradient(circle at 50% 42%, rgba(255,255,255,0.05), transparent 62%),
                    linear-gradient(160deg, #0a0f1f 0%, #123059 32%, #0f5a68 62%, #0a2e24 100%);
                background-attachment: fixed;
                color: rgb(255, 255, 255);
                min-height: 100vh;
                margin: 0;
                padding: clamp(78px, 10vh, 108px) 20px 34px;
                position: relative;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: flex-start;
                gap: 28px;
                overflow-x: clip;
                overflow-y: hidden;
            }

            body::before {
                content: "";
                position: fixed;
                inset: 0;
                background: linear-gradient(120deg, rgba(255,255,255,0.06), transparent 35%, rgba(255,255,255,0.04));
                pointer-events: none;
            }

            .site-tag {
                position: absolute;
                top: 18px;
                left: 20px;
                font-size: 0.95rem;
                letter-spacing: 0.13em;
                opacity: 0.92;
                font-weight: 700;
                text-transform: lowercase;
                color: rgba(255,255,255,0.9);
                z-index: 4;
            }

            .hero {
                display: block;
                width: min(100%, 760px);
                margin: 0 auto;
                text-align: center;
            }

            h1 {
                margin: 0;
                font-size: clamp(1.8rem, 3vw, 3rem);
                font-weight: 900;
                letter-spacing: 0.08em;
                text-transform: uppercase;
                text-align: center;
                color: #ffffff;
                background: linear-gradient(135deg, #ffffff 0%, #dbe8ff 35%, #a6d8ff 70%, #ffffff 100%);
                -webkit-background-clip: text;
                background-clip: text;
                -webkit-text-fill-color: transparent;
                text-shadow: 0 8px 28px rgba(64,120,255,0.22);
                line-height: 0.9;
            }

            .wallet-grid {
                position: relative;
                display: flex;
                justify-content: center;
                align-items: center;
                gap: 22px;
                flex-wrap: wrap;
                margin: 0 auto;
                width: min(960px, 100%);
                padding: 26px 24px 30px;
                border-radius: 28px;
                background: linear-gradient(180deg, rgba(255,255,255,0.035), rgba(255,255,255,0.012));
                border: 1px solid rgba(255,255,255,0.09);
                box-shadow: inset 0 1px 0 rgba(255,255,255,0.06), 0 30px 60px -24px rgba(0,0,0,0.5);
                backdrop-filter: blur(6px);
                -webkit-backdrop-filter: blur(6px);
            }

            .meme-cta {
                position: fixed;
                right: 24px;
                bottom: 24px;
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 10px;
                width: 148px;
                padding: 10px;
                border-radius: 22px;
                background: linear-gradient(165deg, rgba(255,255,255,0.10), rgba(255,255,255,0.045));
                border: 1px solid rgba(255,255,255,0.14);
                box-shadow: inset 0 1px 0 rgba(255,255,255,0.08), 0 18px 40px -14px rgba(0,0,0,0.4), 0 4px 14px rgba(0,0,0,0.18), 0 0 20px rgba(245,166,35,0.45), 0 0 42px rgba(245,166,35,0.4), 0 0 74px rgba(245,166,35,0.16);
                backdrop-filter: blur(14px) saturate(140%);
                -webkit-backdrop-filter: blur(14px) saturate(140%);
                z-index: 10;
            }

            .meme-cta::before {
                content: none;
            }

            .meme-content {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 8px;
                width: 100%;
            }

            .meme-bubble {
                position: relative;
                width: 100%;
                max-width: none;
                padding: 10px 12px 9px;
                border-radius: 14px;
                background: rgba(255,255,255,0.96);
                color: #101827;
                font-weight: 800;
                font-size: 0.7rem;
                line-height: 1.35;
                letter-spacing: 0.04em;
                text-transform: lowercase;
                box-shadow: 0 16px 30px rgba(0,0,0,0.2);
                border: 1px solid rgba(11,18,32,0.08);
                margin: 0;
                text-align: center;
            }

            .reset-shiba {
                appearance: none;
                border: 1px solid rgba(11,18,32,0.12);
                background: rgba(245, 247, 250, 0.9);
                color: #0d1727;
                font-size: 0.52rem;
                letter-spacing: 0.1em;
                text-transform: lowercase;
                border-radius: 999px;
                padding: 5px 9px;
                cursor: pointer;
                box-shadow: 0 6px 14px rgba(8,12,20,0.12);
                transition: background 0.2s ease, transform 0.2s ease, border-color 0.2s ease;
                margin: 0 auto;
                display: none;
                align-items: center;
                justify-content: center;
            }

            .reset-shiba.visible {
                display: inline-flex;
            }

            .reset-shiba:hover {
                background: rgba(255,255,255,1);
                border-color: rgba(11,18,32,0.18);
                transform: translateY(-1px);
            }

            .reset-shiba:active {
                transform: translateY(0);
            }

            .meme-bubble::after {
                content: none;
            }

            .meme-bubble span,
            .meme-bubble strong {
                display: block;
                font-size: 0.72rem;
                line-height: 1.4;
                margin-top: 2px;
                color: #0c1a2a;
                font-weight: 800;
            }

            .shiba-wrap {
                position: relative;
                display: flex;
                justify-content: center;
                align-items: center;
                width: 112px;
                height: 112px;
                padding: 14px;
                border-radius: 22px;
                overflow: hidden;
                background: linear-gradient(165deg, rgba(255,255,255,0.10), rgba(255,255,255,0.045));
                border: 1px solid rgba(255,255,255,0.14) !important;
                box-shadow: inset 0 1px 0 rgba(255,255,255,0.08), 0 18px 40px -14px rgba(0,0,0,0.4), 0 4px 14px rgba(0,0,0,0.18) !important;
                backdrop-filter: blur(14px) saturate(140%);
                -webkit-backdrop-filter: blur(14px) saturate(140%);
                flex-shrink: 0;
                cursor: pointer;
                transition: transform 0.2s ease, box-shadow 0.2s ease;
                margin: 0 auto;
            }

            .shiba-wrap:hover {
                transform: translateY(-2px);
                border-color: rgba(255,255,255,0.24) !important;
                box-shadow: inset 0 1px 0 rgba(255,255,255,0.12), 0 26px 56px -16px rgba(0,0,0,0.48), 0 6px 18px rgba(0,0,0,0.22) !important;
            }

            .shiba-wrap::before {
                content: none;
            }

            .shiba-image {
                display: block;
                width: 82px;
                height: 82px;
                object-fit: cover;
                border-radius: 50%;
                background: rgba(255,255,255,0.04);
                box-shadow: 0 14px 30px rgba(0,0,0,0.22), 0 0 20px rgba(245,166,35,0.45), 0 0 42px rgba(245,166,35,0.4), 0 0 74px rgba(245,166,35,0.16);
                transform: translateY(0);
                animation: floatHero 5.5s ease-in-out infinite;
            }

            .shiba-wrap.smiling .shiba-image {
                filter: saturate(1.2) contrast(1.06);
            }

            @keyframes floatHero {
                0%, 100% { transform: translateY(0px); }
                50% { transform: translateY(-3px); }
            }

            .wallet-grid::before {
                content: "";
                position: absolute;
                inset: -70px;
                background: radial-gradient(ellipse 55% 55% at 50% 42%, rgba(140,180,255,0.14), transparent 70%);
                filter: blur(38px);
                z-index: -1;
                pointer-events: none;
            }

            .wallet-card {
                position: relative;
                display: flex;
                flex-direction: column;
                align-items: center;
                background: linear-gradient(165deg, rgba(255,255,255,0.10), rgba(255,255,255,0.045));
                border: 1px solid rgba(255,255,255,0.14);
                border-radius: 22px;
                padding: 20px 18px 18px;
                width: min(280px, 100%);
                min-height: 304px;
                box-shadow: inset 0 1px 0 rgba(255,255,255,0.08), 0 18px 40px -14px rgba(0,0,0,0.4), 0 4px 14px rgba(0,0,0,0.18);
                backdrop-filter: blur(14px) saturate(140%);
                -webkit-backdrop-filter: blur(14px) saturate(140%);
                overflow: visible;
                transition: transform 0.35s cubic-bezier(.22,1,.36,1), box-shadow 0.35s ease, border-color 0.35s ease;
                cursor: pointer;
            }

            .wallet-card:hover {
                transform: translateY(-6px);
                border-color: rgba(255,255,255,0.24);
                box-shadow: inset 0 1px 0 rgba(255,255,255,0.12), 0 26px 56px -16px rgba(0,0,0,0.48), 0 6px 18px rgba(0,0,0,0.22);
            }

            .wallet-card.expanded {
                transform: translateY(-7px);
            }

            .card-hint {
                margin-top: 10px;
                font-size: 0.64rem;
                letter-spacing: 0.12em;
                text-transform: uppercase;
                text-align: center;
                color: rgba(255,255,255,0.7);
                opacity: 0;
                transform: translateY(4px);
                transition: opacity 220ms ease, transform 220ms ease;
                pointer-events: none;
                user-select: none;
            }

            @media (hover: hover) {
                .wallet-card:hover:not(.expanded) .card-hint {
                    opacity: 0.72;
                    transform: translateY(0);
                }
            }

            .wallet-card.expanded .card-hint {
                display: none;
            }

            .wallet-card .card-details {
                overflow: hidden;
                max-height: 0;
                opacity: 0;
                transition: max-height 320ms cubic-bezier(.22,1,.36,1), opacity 260ms ease, padding 260ms ease;
                padding-top: 0;
            }

            .wallet-card.expanded .card-details {
                max-height: 150px;
                opacity: 1;
                padding-top: 12px;
                overflow: visible;
            }

            .wallet-address.abbrev-mode {
                position: relative;
                display: block;
                margin: 16px auto 0;
                padding: 8px 14px;
                max-width: 94%;
                background: rgba(255,255,255,0.045);
                border: 1px solid rgba(255,255,255,0.1);
                border-radius: 14px;
                font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, "Segoe UI Mono", "Roboto Mono", monospace;
                font-size: 0.76rem;
                letter-spacing: 0.02em;
                line-height: 1.35;
                word-break: break-word;
                text-align: center;
                color: rgba(255,255,255,0.92);
                box-shadow: inset 0 1px 0 rgba(255,255,255,0.03);
                transition: background 0.25s ease, border-color 0.25s ease;
                overflow-wrap: break-word;
                z-index: 2;
            }

            @media (hover: hover) {
                .wallet-address.abbrev-mode:hover {
                    background: rgba(255,255,255,0.08);
                    border-color: rgba(255,255,255,0.2);
                }
            }

            .wallet-address .addr-full {
                display: none;
            }

            .wallet-address .addr-abbrev {
                position: relative;
                display: flex;
                align-items: center;
                justify-content: center;
                pointer-events: auto;
                cursor: pointer;
                color: rgba(255,255,255,0.95);
            }

            .wallet-card.expanded .wallet-address .addr-full {
                display: block;
            }

            .wallet-card.expanded .wallet-address .addr-abbrev {
                display: none;
            }

            .wallet-address .addr-abbrev::after {
                content: attr(data-hint);
                position: absolute;
                left: 50%;
                transform: translateX(-50%) translateY(6px);
                bottom: -30px;
                background: rgba(10,14,24,0.82);
                color: rgba(255,255,255,0.96);
                padding: 6px 9px;
                border-radius: 8px;
                border: 1px solid rgba(255,255,255,0.1);
                font-size: 0.64rem;
                letter-spacing: 0.12em;
                text-transform: uppercase;
                opacity: 0;
                transition: opacity 140ms ease, transform 140ms ease;
                white-space: nowrap;
                pointer-events: none;
                z-index: 9999;
                max-width: calc(100vw - 40px);
                overflow: hidden;
                text-overflow: ellipsis;
            }

            @media (hover: hover) {
                .wallet-address .addr-abbrev:hover::after {
                    opacity: 1;
                    transform: translateX(-50%) translateY(0);
                }
            }

            .wallet-address .addr-abbrev.show-hint::after {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }

            .card-actions {
                display: flex;
                gap: 10px;
                align-items: center;
                justify-content: center;
                flex-wrap: wrap;
                width: 100%;
                margin-top: 14px;
                padding-top: 14px;
                border-top: 1px solid rgba(255,255,255,0.09);
            }

            .send-btn {
                background: rgba(255,255,255,0.07);
                color: white;
                border: 1px solid rgba(255,255,255,0.16);
                padding: 9px 16px;
                border-radius: 999px;
                font-weight: 700;
                font-size: 0.78rem;
                letter-spacing: 0.02em;
                cursor: pointer;
                text-decoration: none;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                flex: 1 1 96px;
                min-width: 0;
                white-space: nowrap;
                transition: background 0.22s ease, border-color 0.22s ease, transform 0.18s ease;
            }

            .send-btn:hover {
                background: rgba(255,255,255,0.14);
                border-color: rgba(255,255,255,0.3);
                transform: translateY(-1px);
            }

            .send-btn:active {
                transform: translateY(0);
            }

            .send-btn:focus-visible {
                outline: 2px solid rgba(255,255,255,0.55);
                outline-offset: 2px;
            }

            .explorer-link {
                color: rgba(255,255,255,0.85);
                text-decoration: none;
                font-weight: 600;
                font-size: 0.78rem;
                letter-spacing: 0.02em;
                cursor: pointer;
                padding: 9px 14px;
                border-radius: 999px;
                border: 1px solid rgba(255,255,255,0.12);
                display: inline-flex;
                align-items: center;
                justify-content: center;
                flex: 1 1 96px;
                min-width: 0;
                white-space: nowrap;
                transition: color 0.22s ease, border-color 0.22s ease, background 0.22s ease;
            }

            .explorer-link:hover {
                color: rgba(255,255,255,1);
                background: rgba(255,255,255,0.06);
                border-color: rgba(255,255,255,0.24);
            }

            .explorer-link:focus-visible {
                outline: 2px solid rgba(255,255,255,0.55);
                outline-offset: 2px;
            }

            .eth-glow .send-btn { border-color: rgba(98,126,234,0.4); }
            .eth-glow .send-btn:hover { border-color: rgba(98,126,234,0.6); background: rgba(98,126,234,0.16); }
            .btc-glow .send-btn { border-color: rgba(245,166,35,0.4); }
            .btc-glow .send-btn:hover { border-color: rgba(245,166,35,0.6); background: rgba(245,166,35,0.16); }
            .sol-glow .send-btn { border-color: rgba(20,241,149,0.4); }
            .sol-glow .send-btn:hover { border-color: rgba(20,241,149,0.6); background: rgba(20,241,149,0.16); }

            .wallet-label {
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 10px;
                width: 100%;
                margin: 0 0 18px;
                padding: 0 8px 8px;
                text-align: center;
                background: transparent;
                border: none;
                border-radius: 0;
                box-shadow: none;
                color: #ffffff;
                font-family: "Segoe UI", "Arial Black", "Impact", sans-serif;
                font-size: 1.65rem;
                letter-spacing: 0.13em;
                text-transform: uppercase;
                font-weight: 900;
                line-height: 1;
                text-shadow: 0 2px 12px rgba(0,0,0,0.28), 0 0 20px rgba(255,255,255,0.1);
            }

            .wallet-logo {
                width: 46px;
                height: 46px;
                display: block;
                object-fit: contain;
                flex-shrink: 0;
                filter: drop-shadow(0 6px 14px rgba(0,0,0,0.32));
                background: transparent;
            }

            .qr-code {
                display: block;
                width: 152px;
                height: 152px;
                margin: 4px auto 0;
                border-radius: 18px;
                background: #ffffff;
                padding: 12px;
                transition: box-shadow 0.3s ease, transform 0.2s ease;
                box-shadow: 0 12px 28px rgba(0,0,0,0.22);
                border: 1px solid rgba(255,255,255,0.8);
                position: relative;
                z-index: 1;
                cursor: pointer;
            }

            .qr-code:hover {
                transform: translateY(-3px) scale(1.02);
            }

            /* Slight colored glows for QR images to match card theme */
            .eth-glow .qr-code {
                box-shadow: 0 14px 30px rgba(0,0,0,0.22), 0 0 20px rgba(98,126,234,0.45), 0 0 42px rgba(98,126,234,0.4), 0 0 74px rgba(98,126,234,0.16);
            }

            .btc-glow .qr-code {
                box-shadow: 0 14px 30px rgba(0,0,0,0.22), 0 0 20px rgba(245,166,35,0.45), 0 0 42px rgba(245,166,35,0.4), 0 0 74px rgba(245,166,35,0.16);
            }

            .sol-glow .qr-code {
                box-shadow: 0 14px 30px rgba(0,0,0,0.22), 0 0 20px rgba(20,241,149,0.45), 0 0 42px rgba(20,241,149,0.4), 0 0 74px rgba(20,241,149,0.16);
            }

            /* Hover lift and pulsing glow animations */
            .wallet-card:hover .qr-code {
                transform: translateY(-6px) scale(1.03);
            }

            .eth-glow:hover .qr-code {
                animation: ethPulse 1.8s ease-in-out infinite;
            }

            @keyframes ethPulse {
                0% {
                    box-shadow: 0 14px 30px rgba(0,0,0,0.22), 0 0 20px rgba(98,126,234,0.45), 0 0 42px rgba(98,126,234,0.4), 0 0 74px rgba(98,126,234,0.16);
                }
                50% {
                    box-shadow: 0 16px 36px rgba(0,0,0,0.26), 0 0 26px rgba(98,126,234,0.6), 0 0 54px rgba(98,126,234,0.55), 0 0 96px rgba(98,126,234,0.24);
                }
                100% {
                    box-shadow: 0 14px 30px rgba(0,0,0,0.22), 0 0 20px rgba(98,126,234,0.45), 0 0 42px rgba(98,126,234,0.4), 0 0 74px rgba(98,126,234,0.16);
                }
            }

            .btc-glow:hover .qr-code {
                animation: btcPulse 1.8s ease-in-out infinite;
            }

            @keyframes btcPulse {
                0% {
                    box-shadow: 0 14px 30px rgba(0,0,0,0.22), 0 0 20px rgba(245,166,35,0.45), 0 0 42px rgba(245,166,35,0.4), 0 0 74px rgba(245,166,35,0.16);
                }
                50% {
                    box-shadow: 0 16px 36px rgba(0,0,0,0.26), 0 0 26px rgba(245,166,35,0.6), 0 0 54px rgba(245,166,35,0.55), 0 0 96px rgba(245,166,35,0.24);
                }
                100% {
                    box-shadow: 0 14px 30px rgba(0,0,0,0.22), 0 0 20px rgba(245,166,35,0.45), 0 0 42px rgba(245,166,35,0.4), 0 0 74px rgba(245,166,35,0.16);
                }
            }

            .sol-glow:hover .qr-code {
                animation: solPulse 1.8s ease-in-out infinite;
            }

            @keyframes solPulse {
                0% {
                    box-shadow: 0 14px 30px rgba(0,0,0,0.22), 0 0 20px rgba(20,241,149,0.45), 0 0 42px rgba(20,241,149,0.4), 0 0 74px rgba(20,241,149,0.16);
                }
                50% {
                    box-shadow: 0 16px 36px rgba(0,0,0,0.26), 0 0 26px rgba(20,241,149,0.6), 0 0 54px rgba(20,241,149,0.55), 0 0 96px rgba(20,241,149,0.24);
                }
                100% {
                    box-shadow: 0 14px 30px rgba(0,0,0,0.22), 0 0 20px rgba(20,241,149,0.45), 0 0 42px rgba(20,241,149,0.4), 0 0 74px rgba(20,241,149,0.16);
                }
            }

            .wallet-card figure {
                margin: 0;
                width: 100%;
            }

            .made-by {
                position: fixed;
                left: 18px;
                bottom: 16px;
                font-size: 0.68rem;
                letter-spacing: 0.13em;
                text-transform: uppercase;
                opacity: 0.58;
                font-weight: 600;
                color: rgba(255,255,255,0.8);
                z-index: 2;
            }

            .eth-glow {
                border-color: rgba(98, 126, 234, 0.24);
                box-shadow: 0 0 0 1px rgba(98, 126, 234, 0.16), 0 12px 26px rgba(21, 35, 67, 0.16), 0 0 20px rgba(98, 126, 234, 0.22), 0 0 44px rgba(98, 126, 234, 0.14);
            }

            .eth-glow:hover {
                border-color: rgba(98, 126, 234, 0.4);
                box-shadow: 0 0 0 1px rgba(98, 126, 234, 0.3), 0 26px 56px -16px rgba(21, 35, 67, 0.5), 0 0 26px rgba(98, 126, 234, 0.3), 0 0 56px rgba(98, 126, 234, 0.18);
            }

            .eth-glow .wallet-label {
                color: rgba(130, 155, 255, 1);
            }

            .btc-glow {
                border-color: rgba(245, 166, 35, 0.24);
                box-shadow: 0 0 0 1px rgba(245, 166, 35, 0.16), 0 12px 26px rgba(44, 29, 5, 0.16), 0 0 20px rgba(245, 166, 35, 0.22), 0 0 44px rgba(245, 166, 35, 0.14);
            }

            .btc-glow:hover {
                border-color: rgba(245, 166, 35, 0.4);
                box-shadow: 0 0 0 1px rgba(245, 166, 35, 0.3), 0 26px 56px -16px rgba(44, 29, 5, 0.5), 0 0 26px rgba(245, 166, 35, 0.3), 0 0 56px rgba(245, 166, 35, 0.18);
            }

            .btc-glow .wallet-label {
                color: rgba(250, 181, 74, 1);
            }

            .sol-glow {
                border-color: rgba(20, 241, 149, 0.24);
                box-shadow: 0 0 0 1px rgba(20, 241, 149, 0.16), 0 12px 26px rgba(12, 39, 26, 0.16), 0 0 20px rgba(20, 241, 149, 0.22), 0 0 44px rgba(20, 241, 149, 0.14);
            }

            .sol-glow:hover {
                border-color: rgba(20, 241, 149, 0.4);
                box-shadow: 0 0 0 1px rgba(20, 241, 149, 0.3), 0 26px 56px -16px rgba(12, 39, 26, 0.5), 0 0 26px rgba(20, 241, 149, 0.3), 0 0 56px rgba(20, 241, 149, 0.18);
            }

            .sol-glow .wallet-label {
                color: rgba(78, 245, 178, 1);
            }

            @media (min-width: 601px) {
                .wallet-card {
                    min-height: 280px;
                    padding: 16px 14px 14px;
                }

                .wallet-card .wallet-label {
                    gap: 7px;
                    margin-bottom: 12px;
                    font-size: 1.45rem;
                }

                .wallet-card .wallet-logo {
                    width: 40px;
                    height: 40px;
                }

                .wallet-card .qr-code {
                    width: 132px;
                    height: 132px;
                    padding: 10px;
                    border-radius: 16px;
                }

                .wallet-card .wallet-address.abbrev-mode {
                    margin-top: 10px;
                    padding: 6px 10px;
                    font-size: 0.68rem;
                }

                .wallet-card .card-actions {
                    gap: 6px;
                    margin-top: 10px;
                    padding-top: 10px;
                }

                .wallet-card .send-btn,
                .wallet-card .explorer-link {
                    padding: 7px 9px;
                    font-size: 0.68rem;
                }
            }

            @media (max-width: 600px) {
                body {
                    padding: 58px 10px 28px;
                    align-items: flex-start;
                    justify-content: flex-start;
                    gap: 18px;
                    overflow-y: auto;
                }

                .site-tag {
                    left: 50%;
                    transform: translateX(-50%);
                    top: 12px;
                    font-size: 0.9rem;
                }

                .made-by {
                    left: auto;
                    right: 12px;
                    bottom: 10px;
                    font-size: 0.64rem;
                }

                .wallet-grid {
                    width: 100%;
                    padding: 22px 10px 132px;
                    gap: 14px;
                    border-radius: 22px;
                    flex-direction: column;
                    align-items: stretch;
                    z-index: 1;
                }

                .meme-cta {
                    right: max(8px, env(safe-area-inset-right));
                    bottom: 14px;
                    width: min(86px, calc(100vw - 16px));
                    max-width: calc(100vw - 16px);
                    padding: 7px;
                    gap: 7px;
                    border-radius: 16px;
                }

                .meme-cta.expanded {
                    width: min(138px, calc(100vw - 16px));
                }

                .meme-content {
                    gap: 6px;
                }

                .meme-bubble {
                    max-width: none;
                    font-size: 0.62rem;
                    padding: 8px 7px;
                }

                .meme-bubble strong {
                    font-size: 0.68rem;
                }

                .copy-note {
                    margin-right: 4px;
                    font-size: 0.54rem;
                    letter-spacing: 0.12em;
                }

                .shiba-wrap {
                    width: 72px;
                    height: 72px;
                }

                .wallet-card {
                    width: 100%;
                    min-height: auto;
                    padding: 15px 12px;
                    margin-bottom: 0;
                }

                .wallet-label {
                    font-size: 1.05rem;
                    gap: 5px;
                    margin-bottom: 10px;
                }

                .wallet-logo {
                    width: 30px;
                    height: 30px;
                }

                .qr-code {
                    width: clamp(92px, 34vw, 124px);
                    height: auto;
                    aspect-ratio: 1/1;
                    margin: 0 auto;
                    padding: 7px;
                    border-radius: 12px;
                    box-shadow: 0 8px 18px rgba(0,0,0,0.18);
                }

                .wallet-address { font-size: 0.66rem; }

                h1 {
                    font-size: clamp(1.3rem, 7vw, 1.6rem);
                    line-height: 1;
                }

                .hero {
                    flex-direction: column;
                    gap: 10px;
                    width: min(100%, 520px);
                    padding: 0;
                }

                h1 {
                    text-align: center;
                }

                .shiba-wrap {
                    width: 68px;
                    height: 68px;
                    padding: 7px;
                }

                .shiba-image {
                    width: 52px;
                    height: 52px;
                }

                .wallet-card.expanded .card-details {
                    max-height: 180px;
                }

                .card-actions {
                    gap: 6px;
                    margin-top: 10px;
                    padding-top: 10px;
                }

                .send-btn,
                .explorer-link {
                    padding: 7px 8px;
                    font-size: 0.66rem;
                }
            }

            @media (min-width: 601px) and (max-width: 980px) {
                .wallet-grid {
                    width: min(860px, 100%);
                    gap: 18px;
                    padding: 20px;
                }

                .wallet-card {
                    width: calc(50% - 12px);
                    min-height: 300px;
                }

                .qr-code {
                    width: clamp(110px, 24vw, 150px);
                }

                .wallet-label { font-size: 1.4rem; }

                .site-tag { left: 18px; top: 14px; transform: none; font-size: 0.95rem; }
                .made-by { left: 16px; right: auto; bottom: 12px; font-size: 0.7rem; }
            }

            @media (min-width: 981px) {
                .wallet-grid {
                    gap: 28px;
                }

                .wallet-card {
                    width: calc(33.333% - 18.666px);
                }
            }

            @media (min-width: 1200px) {
                .wallet-grid {
                    width: min(840px, calc(100% - 48px));
                    gap: 20px;
                }
            }
    </style>
</head>
<body>
    <div class="site-tag">pleasegivemebitcoin.com</div>
    <div class="made-by">Made by Homi</div>

    <header class="hero">
        <h1>PLEASE GIVE ME BITCOIN</h1>
    </header>

    <div class="meme-cta" aria-label="Shiba Inu asking for crypto">
        <div class="meme-content">
            <div class="meme-bubble">
                <span>pls doge.</span>
                <strong>click me</strong>
            </div>
            <button class="reset-shiba" type="button" aria-label="Reset Shiba Inu message">no problem :)</button>
        </div>
        <button class="shiba-wrap" type="button" aria-label="Show Shiba Inu wallet address">
            <img class="shiba-image" src="shibainu.jpg" alt="Shiba Inu">
        </button>
    </div>

    <section class="wallet-grid">
        <article class="wallet-card eth-glow">
            <div class="wallet-label">
                <img class="wallet-logo" src="logoeth.png" alt="Ethereum logo">
                <span>$ETH</span>
            </div>
            <figure class="centered">
                <img class="qr-code" src="ADDRESSETH.png" alt="ETH Address QR Code">
                <figcaption class="wallet-address">0xE965eF6728Da7cdb7042556AD7178eAc9dEB9217</figcaption>
            </figure>
            <div class="card-hint">Click for more details</div>
        </article>

        <article class="wallet-card btc-glow">
            <div class="wallet-label">
                <img class="wallet-logo" src="logobtc.png" alt="Bitcoin logo">
                <span>$BTC</span>
            </div>
            <figure class="centered">
                <img class="qr-code" src="ADDRESSBTC.png" alt="BTC Address QR Code">
                <figcaption class="wallet-address">bc1qk5n4hdzzd3a0f64y740wnhxj8tdapgv8sd9djv</figcaption>
            </figure>
            <div class="card-hint">Click for more details</div>
        </article>

        <article class="wallet-card sol-glow">
            <div class="wallet-label">
                <img class="wallet-logo" src="logosol.png" alt="Solana logo">
                <span>$SOL</span>
            </div>
            <figure class="centered">
                <img class="qr-code" src="ADDRESSSOL.png" alt="SOL Address QR Code">
                <figcaption class="wallet-address">H6BUkTV6htsuav3cw5kMcTYJ2MwYXCQ7B3Ezwq4XYytC</figcaption>
            </figure>
            <div class="card-hint">Click for more details</div>
        </article>
    </section>

    <script>
    (function(){
        const shibaButton = document.querySelector('.shiba-wrap');
        const shibaBubble = document.querySelector('.meme-bubble');
        const resetShibaButton = document.querySelector('.reset-shiba');
        const shibaAddress = 'DANgiX5BPnVK7zJedeAjFRwcdbWwdVnNx9';
        const defaultBubbleHTML = '<span>pls doge.</span><strong>click me</strong>';

        function resetShibaState() {
            if (!shibaButton || !shibaBubble || !resetShibaButton) return;
            shibaButton.classList.remove('smiling');
            shibaButton.querySelector('.shiba-image').src = 'shibainu.jpg';
            shibaBubble.innerHTML = defaultBubbleHTML;
            resetShibaButton.classList.remove('visible');
        }

        if (shibaButton && shibaBubble) {
            shibaButton.addEventListener('click', async function() {
                shibaButton.classList.add('smiling');
                shibaButton.querySelector('.shiba-image').src = 'smilingshibainu.jpg';
                shibaBubble.innerHTML = '<span>address copied</span><strong>:)</strong>';

                if (resetShibaButton) {
                    resetShibaButton.classList.add('visible');
                }

                try {
                    if (navigator.clipboard && window.isSecureContext) {
                        await navigator.clipboard.writeText(shibaAddress);
                    } else {
                        console.warn('Clipboard API unavailable in this context; reset UI still shown.');
                    }
                } catch (err) {
                    console.error('Shiba copy failed', err);
                }
            });
        }

        if (resetShibaButton) {
            resetShibaButton.addEventListener('click', function() {
                resetShibaState();
            });
        }

        const wallets = [
            {
                cssClass: 'eth-glow',
                symbol: 'ETH',
                address: '0xE965eF6728Da7cdb7042556AD7178eAc9dEB9217',
                explorer: 'https://etherscan.io/address/',
                paymentPrefix: 'ethereum:'
            },
            {
                cssClass: 'btc-glow',
                symbol: 'BTC',
                address: 'bc1qk5n4hdzzd3a0f64y740wnhxj8tdapgv8sd9djv',
                explorer: 'https://mempool.space/address/',
                paymentPrefix: 'bitcoin:'
            },
            {
                cssClass: 'sol-glow',
                symbol: 'SOL',
                address: 'H6BUkTV6htsuav3cw5kMcTYJ2MwYXCQ7B3Ezwq4XYytC',
                explorer: 'https://solscan.io/account/',
                paymentPrefix: 'solana:'
            }
        ];

        function abbreviate(addr) {
            return addr.substring(0, 6) + '...' + addr.substring(addr.length - 4);
        }

        function openPaymentUri(uri) {
            window.location.href = uri;
        }

        wallets.forEach(function(wallet) {
            const card = document.querySelector('.wallet-card.' + wallet.cssClass);
            if (!card) return;

            const paymentUri = wallet.paymentPrefix + wallet.address;
            const walletAddrEl = card.querySelector('.wallet-address');
            const qrEl = card.querySelector('.qr-code');

            // Build abbreviated (collapsed) and full (expanded) address elements
            const spanAbbrev = document.createElement('span');
            spanAbbrev.className = 'addr-abbrev';
            spanAbbrev.textContent = abbreviate(wallet.address);
            spanAbbrev.dataset.hint = 'CLICK TO COPY';
            spanAbbrev.setAttribute('role', 'button');
            spanAbbrev.setAttribute('tabindex', '0');

            const spanFull = document.createElement('span');
            spanFull.className = 'addr-full';
            spanFull.textContent = wallet.address;
            spanFull.setAttribute('role', 'button');
            spanFull.setAttribute('tabindex', '0');

            walletAddrEl.textContent = '';
            walletAddrEl.classList.add('abbrev-mode');
            walletAddrEl.appendChild(spanAbbrev);
            walletAddrEl.appendChild(spanFull);

            async function copyAddress() {
                try {
                    await navigator.clipboard.writeText(wallet.address);
                    const prevHint = spanAbbrev.dataset.hint;
                    spanAbbrev.dataset.hint = 'COPIED ✓';
                    spanAbbrev.classList.add('show-hint');
                    setTimeout(function() {
                        spanAbbrev.dataset.hint = prevHint;
                        spanAbbrev.classList.remove('show-hint');
                    }, 1600);
                } catch (err) {
                    console.error('Copy failed', err);
                }
            }

            [spanAbbrev, spanFull].forEach(function(el) {
                el.addEventListener('click', function(e) {
                    e.stopPropagation();
                    copyAddress();
                });
                el.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        e.stopPropagation();
                        copyAddress();
                    }
                });
            });

            // QR code triggers the same payment action as the SEND button
            if (qrEl) {
                qrEl.addEventListener('click', function(e) {
                    e.stopPropagation();
                    openPaymentUri(paymentUri);
                });
            }

            // Expanded content: explorer link + send button (no QR duplication)
            const cardDetails = document.createElement('div');
            cardDetails.className = 'card-details';

            const actions = document.createElement('div');
            actions.className = 'card-actions';

            const explorerLink = document.createElement('a');
            explorerLink.href = wallet.explorer + encodeURIComponent(wallet.address);
            explorerLink.target = '_blank';
            explorerLink.rel = 'noopener noreferrer';
            explorerLink.className = 'explorer-link';
            explorerLink.textContent = '🔍 EXPLORER';
            explorerLink.addEventListener('click', function(e) {
                e.stopPropagation();
            });
            actions.appendChild(explorerLink);

            const sendBtn = document.createElement('a');
            sendBtn.href = paymentUri;
            sendBtn.className = 'send-btn';
            sendBtn.textContent = `SEND ${wallet.symbol} →`;
            sendBtn.addEventListener('click', function(e) {
                e.preventDefault();
                e.stopPropagation();
                openPaymentUri(paymentUri);
            });
            actions.appendChild(sendBtn);

            cardDetails.appendChild(actions);
            card.appendChild(cardDetails);

            function collapse() {
                card.classList.remove('expanded');
            }

            function expand() {
                card.classList.add('expanded');
            }

            function collapseOthers() {
                document.querySelectorAll('.wallet-card.expanded').forEach(function(c) {
                    if (c !== card) c.classList.remove('expanded');
                });
            }

            card.addEventListener('click', function(e) {
                if (e.target.closest('a') || e.target.closest('.addr-abbrev') || e.target.closest('.addr-full') || e.target.closest('.qr-code')) return;
                if (card.classList.contains('expanded')) {
                    collapse();
                } else {
                    collapseOthers();
                    expand();
                }
            });

            card.addEventListener('keydown', function(e) {
                if (e.target !== card) return;
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    if (card.classList.contains('expanded')) {
                        collapse();
                    } else {
                        collapseOthers();
                        expand();
                    }
                }
            });

        });

        // Close expanded card when clicking outside
        document.addEventListener('click', function(e) {
            const inCard = e.target.closest('.wallet-card');
            if (!inCard) {
                document.querySelectorAll('.wallet-card.expanded').forEach(c => c.classList.remove('expanded'));
            }
        });
    })();
    </script>
</body>
</html>
